<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Image Gallery</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>My Image Gallery</h1>

        <p>
            Explore my collection of beautiful images
        </p>
    </header>


    <!-- Category Filters -->
    <section class="filters">

        <button class="filter-btn active"
                onclick="filterImages('all')">
            All
        </button>

        <button class="filter-btn"
                onclick="filterImages('nature')">
            Nature
        </button>

        <button class="filter-btn"
                onclick="filterImages('animals')">
            Animals
        </button>

        <button class="filter-btn"
                onclick="filterImages('places')">
            Places
        </button>

    </section>


    <!-- Image Gallery -->
    <main class="gallery">

        <!-- Image 1 -->
        <div class="gallery-item nature">

            <img src="images/image1.jpg"
                 alt="Nature image"
                 onclick="openLightbox(0)">

        </div>


        <!-- Image 2 -->
        <div class="gallery-item nature">

            <img src="images/image2.jpg"
                 alt="Nature image"
                 onclick="openLightbox(1)">

        </div>


        <!-- Image 3 -->
        <div class="gallery-item animals">

            <img src="images/image3.jpg"
                 alt="Animal image"
                 onclick="openLightbox(2)">

        </div>


        <!-- Image 4 -->
        <div class="gallery-item animals">

            <img src="images/image4.jpg"
                 alt="Animal image"
                 onclick="openLightbox(3)">

        </div>


        <!-- Image 5 -->
        <div class="gallery-item places">

            <img src="images/image5.jpg"
                 alt="Place image"
                 onclick="openLightbox(4)">

        </div>


        <!-- Image 6 -->
        <div class="gallery-item places">

            <img src="images/image6.jpg"
                 alt="Place image"
                 onclick="openLightbox(5)">

        </div>

    </main>


    <!-- Lightbox -->
    <div id="lightbox" class="lightbox">

        <button class="close"
                onclick="closeLightbox()">
            &times;
        </button>


        <button class="navigation prev"
                onclick="previousImage()">
            &#10094;
        </button>


        <img id="lightbox-image"
             src=""
             alt="Large preview">


        <button class="navigation next"
                onclick="nextImage()">
            &#10095;
        </button>

    </div>


    <!-- Footer -->
    <footer>

        <p>
            CodeAlpha Frontend Development Internship
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
